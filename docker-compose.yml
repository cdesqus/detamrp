services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nextgen
      POSTGRES_PASSWORD: nextgen
      POSTGRES_DB: nextgen
    ports: ["5445:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextgen"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
  migrate:
    image: postgres:17-alpine
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: nextgen
      PGUSER: nextgen
      PGPASSWORD: nextgen
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./database/migrations:/migrations:ro
      - ./database/migrate.sh:/migration-tools/migrate.sh:ro
      - ./database/migration-bootstrap.sql:/migration-tools/migration-bootstrap.sql:ro
      - ./database/migrate-one.sql:/migration-tools/migrate-one.sql:ro
    command:
      - /bin/sh
      - -c
      - "sed 's/\\r$//' /migration-tools/migrate.sh > /tmp/migrate.sh && /bin/sh /tmp/migrate.sh"
    restart: "no"
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://nextgen_app:nextgen_app@postgres:5432/nextgen?sslmode=disable
      HTTP_ADDR: :8091
      DEFAULT_TENANT_ID: 00000000-0000-0000-0000-000000000001
      INITIAL_ADMIN_USERNAME: admin
      INITIAL_ADMIN_PASSWORD: change-me-before-production
      EMAIL_ENCRYPTION_KEY: local-prototype-email-key-change-on-server
      APP_BASE_URL: http://localhost:3019
    ports: ["8091:8091"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  frontend:
    build:
      context: ./frontend
      args:
        API_URL: http://backend:8091
    environment:
      API_URL: http://backend:8091
    ports: ["3019:3000"]
    depends_on: ["backend"]
volumes:
  postgres-data:
