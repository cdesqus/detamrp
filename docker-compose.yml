services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nextgen
      POSTGRES_PASSWORD: nextgen
      POSTGRES_DB: nextgen
    ports: ["5445:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextgen"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://nextgen_app:nextgen_app@postgres:5432/nextgen?sslmode=disable
      HTTP_ADDR: :8091
    ports: ["8091:8091"]
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        API_URL: http://backend:8091
    environment:
      API_URL: http://backend:8091
    ports: ["3019:3000"]
    depends_on: ["backend"]
volumes:
  postgres-data:
